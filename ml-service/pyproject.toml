[project]
name = "ml-prediction-service"
version = "1.0.0"
description = "XGBoost-based stock price prediction service"
authors = [{name = "Trading Team"}]
requires-python = ">=3.10"
dependencies = [
    "xgboost>=2.0.3",
    "numpy>=1.26.4",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.2",
    "psycopg2-binary>=2.9.9",
    "ta-lib>=0.4.28",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
